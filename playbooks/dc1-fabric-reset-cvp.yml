---
- name: Reset AVD Fabric via CVP
  hosts: cv_server
  gather_facts: false
  connection: httpapi
  tasks:
    - name: Reset configuration on CVP
      ansible.builtin.import_role:
        name: arista.avd.eos_config_deploy_cvp
      vars:
        container_root: 'DC1_FABRIC'
        configlets_prefix: 'DC1-AVD'
        device_filter: 'DC1'
        state: absent
        cv_collection: v3
