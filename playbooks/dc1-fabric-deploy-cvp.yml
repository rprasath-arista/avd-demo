---
- name: Build Arista EOS EVPN/VXLAN Configuration
  hosts: DC1_FABRIC
  gather_facts: false
  tasks:
    - name: Generate EOS Designs
      tags: [build]
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: Generate EOS CLI Config
      tags: [build]
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen

- name: Deploy Configuration to CVP
  hosts: cv_server
  gather_facts: false
  connection: httpapi
  tasks:
    - name: Deploy configuration via CVP
      tags: [provision]
      ansible.builtin.import_role:
        name: arista.avd.eos_config_deploy_cvp
      vars:
        container_root: 'DC1_FABRIC'
        configlets_prefix: 'DC1-AVD'
        device_filter: 'DC1'
        state: present
        cv_collection: v3

    - name: Execute pending tasks on CVP
      tags: [apply]
      arista.cvp.cv_task_v3:
        tasks: "{{ tasks_to_run }}"
      when: tasks_to_run is defined
